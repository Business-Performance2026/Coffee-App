<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cafeoman">
<meta name="theme-color" content="#6B4226">
<script src="pwa-install.js" defer></script>

<title>تسجيل الدخول</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap" style="max-width:400px; padding-top:60px;">
  <div class="shop-name display" style="text-align:center; margin-bottom:30px;">تسجيل دخول أصحاب الكوفيات</div>

  <div class="card">
    <div class="field">
      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button class="btn" style="width:100%;" onclick="login()">دخول</button>
    <div id="error" class="error-msg"></div>
    <div id="successMsg" style="color:#3D6B4F; font-size:0.85rem; margin-top:8px;"></div>

    <div style="text-align:center; margin-top:16px; font-size:0.85rem;">
      <a href="#" onclick="forgotPassword(); return false;" style="color:var(--accent);">نسيت كلمة المرور؟</a>
    </div>
    <div style="text-align:center; margin-top:10px; font-size:0.85rem; color:var(--stone);">
      ما عندك حساب؟ <a href="signup.html" style="color:var(--accent);">سجل حساب جديد</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
// If already logged in, go straight to dashboard
auth.onAuthStateChanged(user => {
  if (user) window.location.href = 'dashboard.html';
});

function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error');
  errorEl.textContent = '';

  if (!email || !password) {
    errorEl.textContent = 'الرجاء إدخال البريد الإلكتروني وكلمة المرور.';
    return;
  }

  auth.signInWithEmailAndPassword(email, password)
    .then(() => { window.location.href = 'dashboard.html'; })
    .catch(err => {
      errorEl.textContent = 'بيانات الدخول غير صحيحة. حاول مرة أخرى.';
      console.error(err);
    });
}

// Allow Enter key to submit
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});

function forgotPassword() {
  const email = document.getElementById('email').value.trim();
  const errorEl = document.getElementById('error');
  const successEl = document.getElementById('successMsg');
  errorEl.textContent = '';
  successEl.textContent = '';

  if (!email) {
    errorEl.textContent = 'اكتب بريدك الإلكتروني بالخانة فوق أولاً، وبعدين اضغط "نسيت كلمة المرور".';
    return;
  }

  auth.sendPasswordResetEmail(email)
    .then(() => {
      successEl.textContent = 'تم إرسال رابط إعادة تعيين كلمة المرور لبريدك الإلكتروني ✓';
    })
    .catch(err => {
      console.error(err);
      errorEl.textContent = 'تعذر إرسال رابط إعادة التعيين. تأكد من صحة البريد الإلكتروني.';
    });
}
</script>

</body>
</html>
