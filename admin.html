<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cafeoman">
<meta name="theme-color" content="#6B4226">
<script src="pwa-install.js" defer></script>

<title>لوحة الأدمن</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Login screen -->
<div class="wrap" id="loginScreen" style="max-width:400px; padding-top:60px; display:none;">
  <div class="shop-name display" style="text-align:center; margin-bottom:30px;">دخول الأدمن</div>
  <div class="card">
    <div class="field">
      <label for="adminEmail">البريد الإلكتروني</label>
      <input type="email" id="adminEmail">
    </div>
    <div class="field">
      <label for="adminPassword">كلمة المرور</label>
      <input type="password" id="adminPassword">
    </div>
    <button class="btn" style="width:100%;" onclick="adminLogin()">دخول</button>
    <div id="loginError" class="error-msg"></div>
  </div>
</div>

<!-- Admin dashboard -->
<div class="wrap" id="adminScreen" style="display:none;">
  <div class="top-bar">
    <div class="shop-name display">لوحة الأدمن</div>
    <button class="btn btn-ghost" onclick="adminLogout()">تسجيل خروج</button>
  </div>

  <div id="adminHomeView">
    <!-- Overview stats -->
    <div class="sales-summary" style="flex-wrap:wrap; margin-bottom:16px;">
      <div class="sales-summary-box">
        <span class="big-num" id="statTotal">0</span>
        <span class="label">إجمالي الكوفيات</span>
      </div>
      <div class="sales-summary-box">
        <span class="big-num" id="statActive">0</span>
        <span class="label">نشط</span>
      </div>
      <div class="sales-summary-box">
        <span class="big-num" id="statPending">0</span>
        <span class="label">بانتظار التفعيل</span>
      </div>
      <div class="sales-summary-box">
        <span class="big-num" id="statExpired">0</span>
        <span class="label">موقوف</span>
      </div>
    </div>

    <!-- Everything else is an icon: filtered views + adding a new shop -->
    <div class="icon-subnav" style="margin-bottom:16px; flex-wrap:wrap;">
      <button class="icon-subnav-btn" style="position:relative; flex:1 1 28%; min-width:100px;" onclick="openFilteredView('active', 'نشطة')">
        <span class="icon-subnav-icon" style="background:#E3F2E8;">⭐</span>
        <span class="icon-subnav-label">نشطة</span>
      </button>
      <button class="icon-subnav-btn" style="position:relative; flex:1 1 28%; min-width:100px;" onclick="openFilteredView('pending', 'كوفيات جديدة')">
        <span class="icon-subnav-icon" style="background:#E8EEF7;">🆕</span><span class="bell-badge" id="iconBadgePending" style="display:none; top:8px; left:8px;">0</span>
        <span class="icon-subnav-label">كوفيات جديدة</span>
      </button>
      <button class="icon-subnav-btn" style="position:relative; flex:1 1 28%; min-width:100px;" onclick="openFilteredView('expiringSoon', 'قاربت تنتهي')">
        <span class="icon-subnav-icon" style="background:#FBEAD1;">⏰</span><span class="bell-badge" id="iconBadgeExpiringSoon" style="display:none; top:8px; left:8px;">0</span>
        <span class="icon-subnav-label">قاربت تنتهي</span>
      </button>
      <button class="icon-subnav-btn" style="position:relative; flex:1 1 28%; min-width:100px;" onclick="openFilteredView('expired', 'منتهية')">
        <span class="icon-subnav-icon" style="background:#FBE4E0;">❌</span><span class="bell-badge" id="iconBadgeExpired" style="display:none; top:8px; left:8px;">0</span>
        <span class="icon-subnav-label">منتهية</span>
      </button>
      <button class="icon-subnav-btn" style="position:relative; flex:1 1 28%; min-width:100px;" onclick="openFilteredView('all', 'كل الكوفيات')">
        <span class="icon-subnav-icon" style="background:#EDEDED;">📋</span>
        <span class="icon-subnav-label">كل الكوفيات</span>
      </button>
      <button class="icon-subnav-btn" style="position:relative; flex:1 1 28%; min-width:100px;" onclick="openRenewalsView()">
        <span class="icon-subnav-icon" style="background:#E3DDF3;">🔄</span><span class="bell-badge" id="iconBadgeRenewals" style="display:none; top:8px; left:8px;">0</span>
        <span class="icon-subnav-label">طلبات التجديد</span>
      </button>
      <button class="icon-subnav-btn" style="position:relative; flex:1 1 28%; min-width:100px;" onclick="openBillingView()">
        <span class="icon-subnav-icon" style="background:#DDEFF0;">🏦</span>
        <span class="icon-subnav-label">بيانات التحويل</span>
      </button>
      <button class="icon-subnav-btn" style="position:relative; flex:1 1 28%; min-width:100px;" onclick="openAddShopView()">
        <span class="icon-subnav-icon" style="background:#E8DFF5;">➕</span>
        <span class="icon-subnav-label">إضافة كوفي</span>
      </button>
    </div>
  </div>

  <div id="adminAddShopView" style="display:none;">
    <button class="btn btn-ghost" style="margin-bottom:16px;" onclick="closeAddShopView()">→ رجوع</button>

    <!-- Add new shop -->
    <div class="card">
      <h3 style="margin-bottom:16px;">إضافة كوفي جديد</h3>

      <div class="field">
        <label for="newShopName">اسم الكوفي</label>
        <input type="text" id="newShopName" placeholder="مثال: قهوة الروضة">
      </div>
      <div class="field">
        <label for="newShopLocation">الموقع (اختياري)</label>
        <input type="text" id="newShopLocation" placeholder="مثال: مسقط">
      </div>
      <div class="field">
        <label for="newShopColor">اللون المميز</label>
        <input type="color" id="newShopColor" value="#8B5A2B" style="width:80px; padding:4px;">
      </div>
      <div class="field">
        <label for="newOwnerEmail">إيميل صاحب الكوفي (لتسجيل دخوله)</label>
        <input type="email" id="newOwnerEmail" placeholder="owner@example.com">
      </div>
      <div class="field">
        <label for="newOwnerPassword">كلمة مرور مؤقتة له</label>
        <input type="text" id="newOwnerPassword" placeholder="8 أحرف على الأقل">
      </div>

      <button class="btn" onclick="createShop()">إنشاء الكوفي</button>
      <div id="createError" class="error-msg"></div>
      <div id="createSuccess" style="color:#3D6B4F; font-size:0.9rem; margin-top:10px;"></div>
      <div id="qrResult" style="margin-top:16px; text-align:center;"></div>
    </div>
  </div>

  <!-- Subscription renewal requests (bank transfer receipts sent by shop owners) -->
  <div id="adminRenewalsView" style="display:none;">
    <button class="btn btn-ghost" style="margin-bottom:16px;" onclick="closeSubViews()">→ رجوع</button>
    <h3 style="margin:0 0 16px;">طلبات التجديد</h3>
    <div id="renewalsList"><div class="state-msg">جاري التحميل...</div></div>
  </div>

  <!-- Bank-transfer details shown to shop owners on the renewal screen -->
  <div id="adminBillingView" style="display:none;">
    <button class="btn btn-ghost" style="margin-bottom:16px;" onclick="closeSubViews()">→ رجوع</button>
    <div class="card">
      <h3 style="margin-bottom:16px;">بيانات التحويل</h3>
      <div class="field">
        <label for="billingBeneficiary">اسم المستفيد</label>
        <input type="text" id="billingBeneficiary">
      </div>
      <div class="field">
        <label for="billingTransferNo">رقم التحويل (الحساب)</label>
        <input type="text" id="billingTransferNo" dir="ltr">
      </div>
      <div class="field">
        <label for="billingAmount">مبلغ الاشتراك الشهري (ر.ع) — اختياري</label>
        <input type="number" step="0.001" min="0" id="billingAmount">
      </div>
      <button class="btn" onclick="saveBillingSettings()">حفظ</button>
      <div id="billingMsg" style="font-size:0.9rem; margin-top:10px;"></div>
    </div>
  </div>

  <div id="adminFilteredView" style="display:none;">
    <button class="btn btn-ghost" style="margin-bottom:16px;" onclick="closeFilteredView()">→ رجوع</button>
    <h3 id="filteredViewTitle" style="margin:0 0 16px;">الكوفيات</h3>

    <div class="field">
      <input type="text" id="shopSearchInput" placeholder="🔍 ابحث بالاسم..." oninput="renderShopsList()">
    </div>
    <div class="range-tabs" style="margin-bottom:16px;">
      <button class="range-tab" data-filter="all" onclick="setStatusFilter('all', this)">الكل</button>
      <button class="range-tab" data-filter="active" onclick="setStatusFilter('active', this)">نشط</button>
      <button class="range-tab" data-filter="pending" onclick="setStatusFilter('pending', this)">جديدة</button>
      <button class="range-tab" data-filter="expiringSoon" onclick="setStatusFilter('expiringSoon', this)">قاربت تنتهي</button>
      <button class="range-tab" data-filter="expired" onclick="setStatusFilter('expired', this)">موقوف</button>
    </div>

    <div class="card" id="shopsList">
      <div class="state-msg">جاري التحميل...</div>
    </div>
  </div>
</div>

<div id="loadingMsg" class="state-msg">جاري التحقق...</div>

<script src="qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
// Fixes the "login screen flashes then disappears" issue when using the
// phone/browser back button — see dashboard.html for full explanation.
window.addEventListener('pageshow', function (event) {
  if (event.persisted) {
    window.location.reload();
  }
});

// Secondary Firebase app instance — lets us create new shop-owner accounts
// WITHOUT logging the admin out of their own session.
const secondaryApp = firebase.initializeApp(firebase.app().options, "Secondary");
const secondaryAuth = secondaryApp.auth();

let isAdmin = false;

auth.onAuthStateChanged(async user => {
  document.getElementById('loadingMsg').style.display = 'none';

  if (!user) {
    document.getElementById('loginScreen').style.display = 'block';
    return;
  }

  // Check this user is actually listed in the admins collection
  const adminDoc = await db.collection('admins').doc(user.uid).get();
  if (!adminDoc.exists) {
    document.getElementById('loginScreen').style.display = 'block';
    document.getElementById('loginError').textContent = 'هذا الحساب ليس لديه صلاحية أدمن.';
    await auth.signOut();
    return;
  }

  isAdmin = true;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminScreen').style.display = 'block';
  await loadShops();
});

function adminLogin() {
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPassword').value;
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';

  auth.signInWithEmailAndPassword(email, password)
    .catch(err => {
      errorEl.textContent = 'بيانات الدخول غير صحيحة.';
      console.error(err);
    });
}

function adminLogout() {
  auth.signOut().then(() => window.location.reload());
}

function downloadQr() {
  const canvas = document.getElementById('qrCanvas');
  const link = document.createElement('a');
  link.download = 'qr-code.png';
  link.href = canvas.toDataURL();
  link.click();
}

// ---- Load all shops ----
let allShopsData = [];
let statusFilter = 'all';

async function loadShops() {
  const snap = await db.collection('shops').get();
  allShopsData = snap.docs.map(doc => ({ id: doc.id, info: doc.data().info || {} }));

  // Update overview stats
  const active = allShopsData.filter(s => s.info.subscriptionStatus === 'active').length;
  const pending = allShopsData.filter(s => s.info.subscriptionStatus === 'pending').length;
  const expired = allShopsData.filter(s => s.info.subscriptionStatus === 'expired').length;
  document.getElementById('statTotal').textContent = allShopsData.length;
  document.getElementById('statActive').textContent = active;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statExpired').textContent = expired;

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const now = Date.now();

  const newCount = allShopsData.filter(s => {
    if (!s.info.registeredAt || typeof s.info.registeredAt.toDate !== 'function') return false;
    const diffDays = (now - s.info.registeredAt.toDate().getTime()) / (1000 * 60 * 60 * 24);
    return diffDays <= 2;
  }).length;

  const expiringSoonCount = allShopsData.filter(s => {
    if (!s.info.subscriptionEndDate) return false;
    const end = new Date(s.info.subscriptionEndDate);
    end.setHours(0, 0, 0, 0);
    const daysLeft = Math.round((end - today) / (1000 * 60 * 60 * 24));
    return daysLeft >= 0 && daysLeft <= 3;
  }).length;

  const expiredCount = allShopsData.filter(s => {
    if (!s.info.subscriptionEndDate) return false;
    const end = new Date(s.info.subscriptionEndDate);
    end.setHours(0, 0, 0, 0);
    const daysLeft = Math.round((end - today) / (1000 * 60 * 60 * 24));
    return daysLeft < 0;
  }).length;

  updateIconBadge('iconBadgePending', newCount);
  updateIconBadge('iconBadgeExpiringSoon', expiringSoonCount);
  updateIconBadge('iconBadgeExpired', expiredCount);
  refreshRenewalsBadge();

  renderShopsList();
}

function updateIconBadge(elId, count) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.textContent = count;
  el.style.display = count > 0 ? 'flex' : 'none';
}

function renderExpiringBanner() {
  const bannerEl = document.getElementById('expiringBanner');
  if (!bannerEl) return;
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const expiringSoon = allShopsData
    .filter(s => s.info.subscriptionStatus === 'active' && s.info.subscriptionEndDate)
    .map(s => {
      const end = new Date(s.info.subscriptionEndDate);
      end.setHours(0, 0, 0, 0);
      const daysLeft = Math.round((end - today) / (1000 * 60 * 60 * 24));
      return { ...s, daysLeft };
    })
    .filter(s => s.daysLeft <= 3)
    .sort((a, b) => a.daysLeft - b.daysLeft);

  if (expiringSoon.length === 0) {
    bannerEl.innerHTML = '';
    return;
  }

  let rows = expiringSoon.map(s => {
    const label = s.daysLeft < 0
      ? `منتهي منذ ${Math.abs(s.daysLeft)} يوم`
      : (s.daysLeft === 0 ? 'ينتهي اليوم' : `باقي ${s.daysLeft} يوم`);
    return `<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid rgba(0,0,0,0.06);">
      <span>${s.info.name || s.info.email || '(بدون اسم)'}</span>
      <strong>${label}</strong>
    </div>`;
  }).join('');

  bannerEl.innerHTML = `
    <div class="sub-banner sub-banner-warning" style="margin-bottom:16px;">
      ⏰ <strong>${expiringSoon.length}</strong> كوفي محتاج متابعة (اشتراكهم قارب ينتهي أو انتهى):
      <div style="margin-top:8px;">${rows}</div>
    </div>
  `;
}

// ===================== Subscription renewals & transfer details =====================
function escHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function localDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function hideAdminHomeFor(viewId) {
  document.getElementById('adminHomeView').style.display = 'none';
  document.getElementById(viewId).style.display = 'block';
}

function closeSubViews() {
  document.getElementById('adminRenewalsView').style.display = 'none';
  document.getElementById('adminBillingView').style.display = 'none';
  document.getElementById('adminHomeView').style.display = 'block';
  refreshRenewalsBadge();
}

async function refreshRenewalsBadge() {
  try {
    const snap = await db.collection('renewalRequests').where('status', '==', 'pending').get();
    updateIconBadge('iconBadgeRenewals', snap.size);
  } catch (err) {
    console.error('refreshRenewalsBadge failed:', err);
  }
}

async function openBillingView() {
  hideAdminHomeFor('adminBillingView');
  document.getElementById('billingMsg').textContent = '';
  try {
    const doc = await db.collection('platform').doc('billing').get();
    const b = doc.exists ? doc.data() : {};
    document.getElementById('billingBeneficiary').value = b.beneficiaryName || '';
    document.getElementById('billingTransferNo').value = b.transferNumber || '';
    document.getElementById('billingAmount').value = typeof b.amount === 'number' ? b.amount : '';
  } catch (err) {
    console.error('openBillingView failed:', err);
    document.getElementById('billingMsg').textContent = 'تعذر تحميل البيانات: ' + err.message;
  }
}

async function saveBillingSettings() {
  const msg = document.getElementById('billingMsg');
  const amountRaw = document.getElementById('billingAmount').value;
  const data = {
    beneficiaryName: document.getElementById('billingBeneficiary').value.trim(),
    transferNumber: document.getElementById('billingTransferNo').value.trim(),
    amount: amountRaw === '' ? null : parseFloat(amountRaw),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  try {
    await db.collection('platform').doc('billing').set(data);
    msg.style.color = '#3D6B4F';
    msg.textContent = 'تم الحفظ ✓';
  } catch (err) {
    console.error('saveBillingSettings failed:', err);
    msg.style.color = '#B3441E';
    msg.textContent = 'تعذر الحفظ: ' + err.message;
  }
}

async function openRenewalsView() {
  hideAdminHomeFor('adminRenewalsView');
  await loadRenewalRequests();
}

async function loadRenewalRequests() {
  const listEl = document.getElementById('renewalsList');
  listEl.innerHTML = '<div class="state-msg">جاري التحميل...</div>';
  try {
    const snap = await db.collection('renewalRequests').where('status', '==', 'pending').get();
    const reqs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const ts = r => (r.createdAt && r.createdAt.toMillis) ? r.createdAt.toMillis() : 0;
    reqs.sort((a, b) => ts(a) - ts(b)); // oldest first
    updateIconBadge('iconBadgeRenewals', reqs.length);

    if (reqs.length === 0) {
      listEl.innerHTML = '<div class="card"><div class="state-msg">لا توجد طلبات تجديد بانتظار التفعيل.</div></div>';
      return;
    }

    listEl.innerHTML = reqs.map(r => {
      const shop = allShopsData.find(s => s.id === r.shopId);
      const name = (shop && (shop.info.name || shop.info.email)) || r.shopName || '(بدون اسم)';
      const endDate = shop && shop.info.subscriptionEndDate ? shop.info.subscriptionEndDate : '—';
      const when = r.createdAt && r.createdAt.toDate ? r.createdAt.toDate().toLocaleString('en-GB') : '';
      const safeUrl = (typeof r.receiptUrl === 'string' && r.receiptUrl.startsWith('https://')) ? r.receiptUrl : '';
      return `
        <div class="card" style="margin-bottom:12px;">
          <div style="font-weight:700; margin-bottom:4px;">${escHtml(name)}</div>
          <div class="order-items-line">تاريخ الإرسال: <span dir="ltr">${escHtml(when)}</span></div>
          <div class="order-items-line">ينتهي اشتراكه الحالي: <span dir="ltr">${escHtml(endDate)}</span></div>
          ${typeof r.amount === 'number' ? `<div class="order-items-line">المبلغ المتوقع: ${Number(r.amount).toFixed(3)} ر.ع</div>` : ''}
          ${safeUrl ? `<a href="${escHtml(safeUrl)}" target="_blank" rel="noopener"><img src="${escHtml(safeUrl)}" alt="الإيصال" style="max-width:100%; max-height:240px; border-radius:10px; margin:10px 0; border:1px solid var(--line);"></a>` : '<div class="order-items-line">لا يوجد إيصال</div>'}
          <div class="order-actions" style="margin-top:8px;">
            <button class="btn" onclick="approveRenewal('${r.id}', '${r.shopId}')">✅ تفعيل (+30 يوم)</button>
            <button class="btn btn-ghost" style="color:#B3441E;" onclick="rejectRenewal('${r.id}')">❌ رفض</button>
          </div>
        </div>`;
    }).join('');
  } catch (err) {
    console.error('loadRenewalRequests failed:', err);
    listEl.innerHTML = '<div class="state-msg">تعذر تحميل الطلبات: ' + escHtml(err.message) + '</div>';
  }
}

async function approveRenewal(reqId, shopId) {
  if (!confirm('تأكدت من وصول التحويل؟ بيتم تفعيل الاشتراك 30 يوم.')) return;
  if (!(await ensureFreshAdminSession())) return;
  try {
    const shopRef = db.collection('shops').doc(shopId);
    const reqRef = db.collection('renewalRequests').doc(reqId);
    const [shopDoc, reqDoc] = await Promise.all([shopRef.get(), reqRef.get()]);
    if (!shopDoc.exists || !reqDoc.exists) { alert('الطلب أو الكوفي غير موجود.'); return; }
    const info = shopDoc.data().info || {};
    const reqData = reqDoc.data();
    if (reqData.status !== 'pending') { alert('هذا الطلب تمت معالجته مسبقاً.'); await loadRenewalRequests(); return; }

    // Extend from the current end date if it's still in the future (so no
    // paid days are lost), otherwise count 30 days from today.
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    let base = today;
    if (info.subscriptionEndDate) {
      const end = new Date(info.subscriptionEndDate);
      end.setHours(0, 0, 0, 0);
      if (!isNaN(end) && end > today) base = end;
    }
    const newEnd = new Date(base);
    newEnd.setDate(newEnd.getDate() + 30);
    const newEndStr = localDateStr(newEnd);

    const batch = db.batch();
    batch.update(shopRef, {
      'info.subscriptionStatus': 'active',
      'info.subscriptionEndDate': newEndStr,
      'info.suspensionReason': firebase.firestore.FieldValue.delete()
    });
    batch.update(reqRef, {
      status: 'approved',
      newEndDate: newEndStr,
      reviewedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    if (typeof reqData.amount === 'number' && reqData.amount > 0) {
      batch.set(shopRef.collection('payments').doc(), {
        amount: reqData.amount,
        note: 'تجديد اشتراك عبر التحويل',
        recordedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    await batch.commit();
    await loadShops();
    await loadRenewalRequests();
  } catch (err) {

function renderShopsList() {
  const listEl = document.getElementById('shopsList');
  const query = (document.getElementById('shopSearchInput').value || '').trim().toLowerCase();

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const now = Date.now();

  let filtered = allShopsData.filter(s => {
    const info = s.info;

    if (statusFilter === 'active') {
      // "نشطة": had a real order in the last 3 days — regardless of
      // subscriptionStatus. A shop can be subscribed but unused, or vice versa.
      if (!info.lastOrderAt || typeof info.lastOrderAt.toDate !== 'function') return false;
      const diffDays = (now - info.lastOrderAt.toDate().getTime()) / (1000 * 60 * 60 * 24);
      if (diffDays > 3) return false;

    } else if (statusFilter === 'pending') {
      // "كوفيات جديدة": registered within the last 2 days — regardless of
      // whether they've been activated yet or not.
      if (!info.registeredAt || typeof info.registeredAt.toDate !== 'function') return false;
      const diffDays = (now - info.registeredAt.toDate().getTime()) / (1000 * 60 * 60 * 24);
      if (diffDays > 2) return false;

    } else if (statusFilter === 'expiringSoon') {
      // "قاربت تنتهي": has an end date, 3 days or fewer left, but not yet passed.
      if (!info.subscriptionEndDate) return false;
      const end = new Date(info.subscriptionEndDate);
      end.setHours(0, 0, 0, 0);
      const daysLeft = Math.round((end - today) / (1000 * 60 * 60 * 24));
      if (daysLeft < 0 || daysLeft > 3) return false;

    } else if (statusFilter === 'expired') {
      // "منتهية": has an end date that has already passed — based on the
      // actual date, not the stored subscriptionStatus field.
      if (!info.subscriptionEndDate) return false;
      const end = new Date(info.subscriptionEndDate);
      end.setHours(0, 0, 0, 0);
      const daysLeft = Math.round((end - today) / (1000 * 60 * 60 * 24));
      if (daysLeft >= 0) return false;
    }
    // statusFilter === 'all' → no filtering by status at all

    if (query && !(info.name || '').toLowerCase().includes(query) && !(info.nameEn || '').toLowerCase().includes(query)) return false;
    return true;
  });

  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="state-msg">لا توجد كوفيات مطابقة.</div>';
    return;
  }

  let html = '';
  filtered.forEach(({ id, info }) => {
    const active = info.subscriptionStatus === 'active';
    const statusLabel = info.subscriptionStatus === 'pending' ? 'بانتظار التفعيل' : (active ? 'مفعّل ✓' : 'موقوف');
    const waNumber = (info.whatsapp || '').replace(/[^0-9]/g, '');

    html += `
      <div class="dashboard-item" style="flex-wrap:wrap;">
        <div class="grow">
          <div class="item-name">${info.name || info.email || '(بدون اسم)'}</div>
          <div class="item-desc">${info.location || ''} · ${statusLabel}</div>
          <div>${getActivityBadge(info)}</div>
          ${!active && info.suspensionReason ? `<div class="item-desc" style="color:#B3441E;">السبب: ${info.suspensionReason}</div>` : ''}
          <div class="field" style="margin:8px 0 0;">
            <label style="font-size:0.75rem;">تاريخ انتهاء الاشتراك</label>
            <input type="date" value="${info.subscriptionEndDate || new Date().toISOString().slice(0, 10)}" onchange="updateEndDate('${id}', this.value)" style="padding:6px 8px;">
          </div>

          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
            ${waNumber ? `<a href="https://wa.me/${waNumber}" target="_blank" class="btn btn-ghost" style="padding:6px 12px; font-size:0.8rem; text-decoration:none;">💬 واتساب</a>` : ''}
            <button class="btn btn-ghost" style="padding:6px 12px; font-size:0.8rem;" onclick="toggleNotes('${id}')">📝 ملاحظات</button>
            <button class="btn btn-ghost" style="padding:6px 12px; font-size:0.8rem;" onclick="openPaymentsModal('${id}')">💰 المدفوعات</button>
            <button class="btn btn-ghost" style="padding:6px 12px; font-size:0.8rem;" onclick="openEditModal('${id}')">✏️ تعديل</button>
          </div>

          <div id="notes-${id}" style="display:none; margin-top:10px;">
            <textarea id="notesInput-${id}" rows="3" style="width:100%; padding:8px; border:1px solid var(--line); border-radius:var(--radius); font-family:inherit;" placeholder="ملاحظاتك الخاصة عن هذا الكوفي..."></textarea>
            <button class="btn" style="margin-top:6px; padding:6px 14px; font-size:0.85rem;" onclick="saveNotes('${id}')">حفظ الملاحظة</button>
            <span id="notesStatus-${id}" style="font-size:0.8rem; color:#3D6B4F; margin-right:8px;"></span>
          </div>
        </div>
        <button class="btn ${active ? 'btn-danger' : 'btn-ghost'}" onclick='toggleSubscription("${id}", ${active})'>
          ${active ? 'إيقاف' : 'تفعيل'}
        </button>
      </div>
    `;
  });
  listEl.innerHTML = html;
}

// Shows a colored badge for how recently a shop received a real order
// (customer QR order or counter order) — 🟢 active / 🟡 slow / 🔴 inactive.
// Shops that haven't received any order since this feature launched will
// simply show "لم يُستخدم بعد" until their next order comes in.
function getActivityBadge(info) {
  if (!info.lastOrderAt || typeof info.lastOrderAt.toDate !== 'function') {
    return `<span style="display:inline-block; font-size:0.75rem; font-weight:600; padding:3px 10px; border-radius:999px; margin-top:6px; background:#F1E9E0; color:var(--stone);">⚪ لم يُستخدم بعد</span>`;
  }

  const last = info.lastOrderAt.toDate();
  const diffDays = Math.max(0, Math.floor((Date.now() - last.getTime()) / (1000 * 60 * 60 * 24)));

  let dot, colorStyle;
  if (diffDays <= 3) {
    dot = '🟢'; colorStyle = 'background:#DCEEE0; color:#3D7A47;';
  } else if (diffDays <= 14) {
    dot = '🟡'; colorStyle = 'background:#FBEAD1; color:#A6650D;';
  } else {
    dot = '🔴'; colorStyle = 'background:#FBEAE5; color:#B3441E;';
  }

  const label = diffDays === 0 ? 'اليوم' : `قبل ${diffDays} يوم`;
  return `<span style="display:inline-block; font-size:0.75rem; font-weight:600; padding:3px 10px; border-radius:999px; margin-top:6px; ${colorStyle}">${dot} آخر طلب: ${label}</span>`;
}

// Admin writes are rejected as "Missing or insufficient permissions" when the
// login token has gone stale (e.g. the page stayed open for a long time on a
// weak mobile connection). Refreshing the token first avoids that, and if it
// still can't be refreshed we say so clearly instead of showing a raw error.
async function ensureFreshAdminSession() {
  try {
    if (!auth.currentUser) throw new Error('no user');
    await auth.currentUser.getIdToken(true);
    return true;
  } catch (err) {
    console.error('Admin session refresh failed:', err);
    alert('انتهت جلسة الأدمن أو الاتصال ضعيف. حدّث الصفحة وسجّل دخول من جديد ثم حاول مرة ثانية.');
    return false;
  }
}

function adminErrorMessage(err) {
  if (err && err.code === 'permission-denied') {
    return 'صار خطأ: ما عندك صلاحية لهذي العملية. حدّث الصفحة وسجّل دخول من جديد، ولو استمرت المشكلة تأكد من نشر قواعد Firestore الأخيرة.';
  }
  return 'صار خطأ: ' + ((err && err.message) || err);
}

// When an admin action is refused, work out WHY so the message tells you what
// to do (instead of only the raw "Missing or insufficient permissions").
async function explainPermissionDenied() {
  try {
    if (!auth.currentUser) {
      return 'انتهت جلسة الأدمن في هذا المتصفح. اضغط تسجيل الخروج ثم سجّل دخول من جديد.';
    }
    await auth.currentUser.getIdToken(true);
    const me = await db.collection('admins').doc(auth.currentUser.uid).get();
    if (me.exists) {
      return 'حسابك أدمن، لكن قواعد Firestore المنشورة ما تسمح بالمدفوعات. انشر ملف firestore-rules.txt الأخير من Firebase Console.';
    }
    return 'هذا الحساب غير معروف كأدمن. سجّل خروج ثم ادخل بحساب الأدمن.';
  } catch (e) {
    console.error('explainPermissionDenied:', e);
    return 'جلسة الأدمن في هذا المتصفح منتهية أو تالفة. سجّل خروج ثم ادخل من جديد، ولو استمرت المشكلة امسح بيانات الموقع من المتصفح.';
  }
}

async function updateEndDate(shopId, value) {
  if (!(await ensureFreshAdminSession())) return;
  try {
    await db.collection('shops').doc(shopId).update({ 'info.subscriptionEndDate': value || null });
  } catch (err) {
    console.error('updateEndDate failed:', err);
    alert(adminErrorMessage(err));
  }
}

async function addPayment(shopId) {
  const amount = parseFloat(document.getElementById('paymentAmount').value);
  const note = document.getElementById('paymentNote').value.trim();
  const errorEl = document.getElementById('paymentError');

  if (isNaN(amount) || amount <= 0) {
    errorEl.textContent = 'أدخل مبلغ صحيح.';
    return;
  }
  errorEl.textContent = '';

  if (!(await ensureFreshAdminSession())) return;

  try {
    await db.collection('shops').doc(shopId).collection('payments').add({
      amount,
      note: note || null,
      recordedAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById('paymentAmount').value = '';
    document.getElementById('paymentNote').value = '';
    await loadPayments(shopId);
  } catch (err) {
    console.error('addPayment failed:', err);
    if (err && err.code === 'permission-denied') {
      errorEl.textContent = 'تعذر إضافة الدفعة: ' + (await explainPermissionDenied());
    } else {
      errorEl.textContent = 'تعذر إضافة الدفعة: ' + ((err && err.message) || err);
    }
  }
}

async function loadPayments(shopId) {
  const listEl = document.getElementById('paymentsList');
  let snap;
  try {
    snap = await db.collection('shops').doc(shopId).collection('payments')
      .orderBy('recordedAt', 'desc').get();
  } catch (err) {
    console.error('loadPayments failed:', err);
    const msg = (err && err.code === 'permission-denied')
      ? await explainPermissionDenied()
      : ((err && err.message) || String(err));
    if (listEl) listEl.innerHTML = `<div class="state-msg" style="color:#B3441E;">تعذر تحميل السجل: ${msg}</div>`;
    return;
  }

  if (snap.empty) {
    listEl.innerHTML = '<div class="state-msg">لا توجد دفعات مسجّلة بعد.</div>';
    return;
  }

  let total = 0;
  let html = '';
  paymentsCache = {};
  const iconBtn = 'background:none; border:none; cursor:pointer; font-size:1.05rem; padding:4px 6px; line-height:1;';
  snap.forEach(doc => {
    const p = doc.data();
    total += Number(p.amount) || 0;
    paymentsCache[doc.id] = { amount: p.amount, note: p.note || '' };
    const dateStr = p.recordedAt ? p.recordedAt.toDate().toLocaleDateString('ar-OM') : '';
    html += `
      <div class="top-item-row" id="payrow-${doc.id}" style="align-items:center; gap:6px;">
        <span style="flex:1;">${dateStr}${p.note ? ' · ' + paymentEsc(p.note) : ''}</span>
        <span style="white-space:nowrap;">${Number(p.amount).toFixed(2)} ر.ع</span>
        <button type="button" title="تعديل" style="${iconBtn}" onclick="editPayment('${shopId}', '${doc.id}')">✏️</button>
        <button type="button" title="حذف" style="${iconBtn}" onclick="deletePayment('${shopId}', '${doc.id}')">🗑️</button>
      </div>
    `;
  });
  html = `<div class="top-item-row" style="font-weight:600;"><span>الإجمالي</span><span>${total.toFixed(2)} ر.ع</span></div>` + html;
  listEl.innerHTML = html;
}

// ---- Edit / delete a payment record ----
// These only change the payment LOG. They never touch the shop's subscription
// dates — those are managed separately (renewals / the end-date field).
let paymentsCache = {}; // paymentId -> { amount, note }

function paymentEsc(v) {
  return String(v).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function editPayment(shopId, id) {
  const p = paymentsCache[id];
  const row = document.getElementById('payrow-' + id);
  if (!p || !row) return;
  const inputStyle = 'padding:8px; border:1px solid var(--line); border-radius:var(--radius);';
  row.style.flexWrap = 'wrap';
  row.innerHTML = `
    <input type="number" step="0.001" id="payEditAmount-${id}" placeholder="المبلغ" style="flex:1; min-width:90px; ${inputStyle}">
    <input type="text" id="payEditNote-${id}" placeholder="ملاحظة (اختياري)" style="flex:2; min-width:120px; ${inputStyle}">
    <button type="button" class="btn" style="padding:8px 16px;" onclick="savePaymentEdit('${shopId}', '${id}')">حفظ</button>
    <button type="button" class="btn btn-ghost" style="padding:8px 16px;" onclick="loadPayments('${shopId}')">إلغاء</button>
  `;
  document.getElementById('payEditAmount-' + id).value = p.amount;
  document.getElementById('payEditNote-' + id).value = p.note || '';
}

async function savePaymentEdit(shopId, id) {
  const errorEl = document.getElementById('paymentError');
  const amount = parseFloat(document.getElementById('payEditAmount-' + id).value);
  const note = document.getElementById('payEditNote-' + id).value.trim();
  if (isNaN(amount) || amount <= 0) {
    errorEl.textContent = 'أدخل مبلغ صحيح.';
    return;
  }
  errorEl.textContent = '';
  if (!(await ensureFreshAdminSession())) return;
  try {
    await db.collection('shops').doc(shopId).collection('payments').doc(id).update({
      amount,
      note: note || null,
      editedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await loadPayments(shopId);
  } catch (err) {
    console.error('savePaymentEdit failed:', err);
    errorEl.textContent = 'تعذر تعديل الدفعة: ' + ((err && err.code === 'permission-denied')
      ? await explainPermissionDenied()
      : ((err && err.message) || err));
  }
}

async function deletePayment(shopId, id) {
  const errorEl = document.getElementById('paymentError');
  if (!confirm('تحذف هذي الدفعة من السجل؟ (الحذف من السجل فقط، ما يغيّر تاريخ الاشتراك).')) return;
  errorEl.textContent = '';
  if (!(await ensureFreshAdminSession())) return;
  try {
    await db.collection('shops').doc(shopId).collection('payments').doc(id).delete();
    await loadPayments(shopId);
  } catch (err) {
    console.error('deletePayment failed:', err);
    errorEl.textContent = 'تعذر حذف الدفعة: ' + ((err && err.code === 'permission-denied')
      ? await explainPermissionDenied()
      : ((err && err.message) || err));
  }
}

    QRCode.toCanvas(document.getElementById('adminEditQrCanvas'), menuUrl, { width: 160 }).catch(err => console.error(err));
  }
}

async function copyAdminMenuLink() {
  const url = document.getElementById('adminMenuUrlText').textContent;
  const statusEl = document.getElementById('adminCopyLinkStatus');
  try {
    await navigator.clipboard.writeText(url);
    statusEl.textContent = 'تم نسخ الرابط ✓';
  } catch (err) {
    const tempInput = document.createElement('textarea');
    tempInput.value = url;
    document.body.appendChild(tempInput);
    tempInput.select();
    try {
      document.execCommand('copy');
      statusEl.textContent = 'تم نسخ الرابط ✓';
    } catch (e) {
      statusEl.textContent = 'تعذر النسخ، انسخه يدوياً من الأعلى';
    }
    document.body.removeChild(tempInput);
  }
  setTimeout(() => { statusEl.textContent = ''; }, 3000);
}

async function resetOwnerPassword(email) {
  const statusEl = document.getElementById('resetPwStatus');
  if (!email) {
    statusEl.style.color = '#B3441E';
    statusEl.textContent = 'ما فيه إيميل مسجّل لهذا الكوفي.';
    return;
  }
  try {
    await auth.sendPasswordResetEmail(email);
    statusEl.style.color = '#3D6B4F';
    statusEl.textContent = `تم إرسال رابط إعادة التعيين إلى ${email} ✓`;
  } catch (err) {
    console.error(err);
    statusEl.style.color = '#B3441E';
    statusEl.textContent = 'تعذر إرسال الرابط. تأكد من صحة الإيميل.';
  }
}

async function saveEditedShop(shopId) {
  const errorEl = document.getElementById('editError');
  const name = document.getElementById('editName').value.trim();

  if (!name) {
    errorEl.textContent = 'اسم الكوفي مطلوب.';
    return;
  }

  try {
    await db.collection('shops').doc(shopId).update({
      'info.name': name,
      'info.nameEn': document.getElementById('editNameEn').value.trim(),
      'info.location': document.getElementById('editLocation').value.trim(),
      'info.tagline': document.getElementById('editTagline').value.trim(),
      'info.taglineEn': document.getElementById('editTaglineEn').value.trim(),
      'info.whatsapp': document.getElementById('editWhatsapp').value.trim(),
      'info.phone': document.getElementById('editPhone').value.trim(),
      'info.email': document.getElementById('editEmail').value.trim(),
      'info.primaryColor': document.getElementById('editColor').value,
      'info.estimatedMinutes': parseInt(document.getElementById('editPrepTime').value) || 10
    });
    document.getElementById('editOverlay').remove();
    await loadShops();
  } catch (err) {
    console.error(err);
    errorEl.textContent = 'حدث خطأ أثناء الحفظ.';
  }
}

// ---- Toggle a shop's subscription on/off ----
async function toggleSubscription(shopId, currentlyActive) {
  const updateData = {
    'info.subscriptionStatus': currentlyActive ? 'expired' : 'active'
  };

  if (currentlyActive) {
    // Being suspended — ask why, so the owner can see the reason on their dashboard
    const reason = prompt('ليش تبي توقف هذا الكوفي؟ (بيظهر السبب لصاحب الكوفي)');
    if (reason === null) return; // admin cancelled the prompt — abort the whole action
    updateData['info.suspensionReason'] = reason || 'غير محدد';
  } else {
    // Being reactivated — clear any old suspension reason
    updateData['info.suspensionReason'] = firebase.firestore.FieldValue.delete();
  }

  if (!(await ensureFreshAdminSession())) return;
  try {
    await db.collection('shops').doc(shopId).update(updateData);
  } catch (err) {
    console.error('toggleSubscription failed:', err);
    alert(adminErrorMessage(err));
    return;
  }
  // The change is saved at this point; a failure while redrawing the list
  // must never be reported as if the activation itself had failed.
  try {
    await loadShops();
  } catch (err) {
    console.error('loadShops after toggle failed:', err);
  }
}

// ---- Create a brand new shop (auth account + Firestore doc) ----
// ===================== Global category icons (shown on every shop's menu) =====================
async function createShop() {
  const errorEl = document.getElementById('createError');
  const successEl = document.getElementById('createSuccess');
  errorEl.textContent = '';
  successEl.textContent = '';

  const name = document.getElementById('newShopName').value.trim();
  const location = document.getElementById('newShopLocation').value.trim();
  const color = document.getElementById('newShopColor').value;
  const email = document.getElementById('newOwnerEmail').value.trim();
  const password = document.getElementById('newOwnerPassword').value;

  if (!name || !email || !password) {
    errorEl.textContent = 'الرجاء تعبئة اسم الكوفي وإيميل وكلمة مرور صاحب الكوفي.';
    return;
  }
  if (password.length < 6) {
    errorEl.textContent = 'كلمة المرور لازم تكون 6 أحرف على الأقل.';
    return;
  }

  try {
    // Create the owner's account using the SECONDARY app instance
    // so the admin's own session stays logged in.
    const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
    const newUid = cred.user.uid;

    // Immediately sign out of the secondary instance (cleanup)
    await secondaryAuth.signOut();

    // 14-day free trial, same length as the self-signup trial in dashboard.html
    const trialEnd = new Date();
    trialEnd.setDate(trialEnd.getDate() + 14);
    const trialEndStr = trialEnd.toISOString().split('T')[0];

    // Create the shop's Firestore document, ID = new owner's UID
    await db.collection('shops').doc(newUid).set({
      info: {
        name,
        location,
        primaryColor: color,
        logo: '',
        subscriptionStatus: 'active',
        subscriptionEndDate: trialEndStr,
        registeredAt: firebase.firestore.FieldValue.serverTimestamp()
      }
    });

    // Build the public menu link for this shop, save it, and generate its QR code
    const menuUrl = window.location.origin + window.location.pathname.replace('admin.html', '') + 'menu.html?shop=' + newUid;
    await db.collection('shops').doc(newUid).update({ 'info.menuUrl': menuUrl });

    successEl.textContent = `تم إنشاء الكوفي بنجاح ✓`;

    const qrDiv = document.getElementById('qrResult');
    qrDiv.innerHTML = `
      <canvas id="qrCanvas"></canvas>
      <div style="font-size:0.8rem; color:var(--stone); word-break:break-all; margin:8px 0;">${menuUrl}</div>
      <button class="btn btn-ghost" onclick="downloadQr()">تحميل الباركود</button>
    `;
    try {
      if (typeof QRCode === 'undefined') throw new Error('مكتبة QR ما تحمّلت من الإنترنت');
      await QRCode.toCanvas(document.getElementById('qrCanvas'), menuUrl, { width: 200 });
    } catch (qrErr) {
      console.error('QR generation failed:', qrErr);
      qrDiv.innerHTML += `<div class="error-msg">تعذر توليد الباركود: ${qrErr.message}</div>`;
    }

    // Reset form
    document.getElementById('newShopName').value = '';
    document.getElementById('newShopLocation').value = '';
    document.getElementById('newOwnerEmail').value = '';
    document.getElementById('newOwnerPassword').value = '';

    await loadShops();

  } catch (err) {
    console.error(err);
    if (err.code === 'auth/email-already-in-use') {
      errorEl.textContent = 'هذا الإيميل مستخدم مسبقاً لكوفي آخر.';
    } else {
      errorEl.textContent = 'حدث خطأ أثناء الإنشاء. حاول مرة أخرى.';
    }
  }
}
