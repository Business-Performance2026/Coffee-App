<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القائمة</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap" id="app">
  <div class="state-msg">جاري تحميل القائمة...</div>
</div>

<button class="lang-toggle" id="langToggle" onclick="toggleLang()" style="display:none;">EN</button>

<!-- Floating cart bar -->
<div class="cart-bar" id="cartBar" style="display:none;" onclick="openCartModal()">
  <span id="cartCount">0 أصناف</span>
  <span id="cartTotal">0.00 ر.ع</span>
</div>

<!-- Persistent order status bar (shown after an order is placed) -->
<div class="status-bar" id="orderStatusBar" style="display:none;" onclick="openStatusModal()">
  <span id="statusBarText"></span>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
let shopId = null;
let shopInfo = {};
let cart = {}; // { itemId: { name, price, qty } }
let itemMeta = {}; // { itemId: { name, price } } — used to safely rebuild controls without re-escaping strings
let currentLang = localStorage.getItem('menuLang') || 'ar';

const translations = {
  loadingMenu: { ar: 'جاري تحميل القائمة...', en: 'Loading menu...' },
  invalidLink: { ar: 'رابط غير صحيح — لا يوجد معرّف كوفي.', en: 'Invalid link — no shop ID found.' },
  shopNotFound: { ar: 'هذا الكوفي غير موجود.', en: 'This shop does not exist.' },
  menuUnavailable: { ar: 'القائمة غير متاحة حالياً.', en: 'Menu is currently unavailable.' },
  noItems: { ar: 'لا توجد أصناف بالقائمة حالياً.', en: 'No items on the menu yet.' },
  loadError: { ar: 'حدث خطأ أثناء تحميل القائمة.', en: 'An error occurred while loading the menu.' },
  unavailableTag: { ar: 'غير متاح', en: 'Unavailable' },
  itemsWord: { ar: 'أصناف', en: 'items' },
  currency: { ar: 'ر.ع', en: 'OMR' },
  reviewOrder: { ar: 'مراجعة الطلب', en: 'Review order' },
  total: { ar: 'الإجمالي', en: 'Total' },
  yourName: { ar: 'اسمك', en: 'Your name' },
  namePlaceholder: { ar: 'مثال: أحمد', en: 'e.g. Ahmed' },
  tableNumber: { ar: 'رقم الطاولة (اختياري)', en: 'Table number (optional)' },
  tablePlaceholder: { ar: 'مثال: 5', en: 'e.g. 5' },
  notesLabel: { ar: 'ملاحظات (اختياري)', en: 'Notes (optional)' },
  notesPlaceholder: { ar: 'مثال: بدون سكر', en: 'e.g. no sugar' },
  sendOrder: { ar: 'إرسال الطلب', en: 'Send order' },
  enterNameError: { ar: 'الرجاء إدخال اسمك.', en: 'Please enter your name.' },
  orderSendError: { ar: 'حدث خطأ أثناء إرسال الطلب. حاول مرة أخرى.', en: 'Something went wrong sending your order. Please try again.' },
  orderSent: { ar: 'تم إرسال طلبك!', en: 'Your order has been sent!' },
  close: { ar: 'إغلاق', en: 'Close' },
  yourOrderStatus: { ar: 'حالة طلبك', en: 'Your order status' },
  etaText: { ar: 'الوقت المتوقع', en: 'Estimated time' },
  minuteWord: { ar: 'دقيقة', en: 'min' },
  orderPickedUp: { ar: 'طلب جاهز', en: 'Order picked up' },
  stepReceived: { ar: 'استلم طلبك', en: 'Order received' },
  stepPreparing: { ar: 'جاري التحضير', en: 'Preparing' },
  stepReady: { ar: 'الطلب جاهز', en: 'Ready' },
  barReceived: { ar: '✅ تم استلام طلبك', en: '✅ Order received' },
  barPreparing: { ar: '🔥 جاري تحضير طلبك', en: '🔥 Preparing your order' },
  barReady: { ar: '🎉 طلبك جاهز — تفضل استلمه', en: '🎉 Your order is ready — please pick it up' },
  orderFromCar: { ar: 'طلب من السيارة', en: 'Order from car' },
  orderFromTable: { ar: 'طلب من الطاولة', en: 'Order from table' },
  carNumber: { ar: 'رقم السيارة', en: 'Car plate number' },
  carNumberPlaceholder: { ar: 'مثال: 12345', en: 'e.g. 12345' },
  carColor: { ar: 'لون ونوع السيارة', en: 'Car color & model' },
  carColorPlaceholder: { ar: 'مثال: تويوتا بيضاء', en: 'e.g. White Toyota' },
  carFieldsError: { ar: 'الرجاء إدخال رقم السيارة ولونها.', en: 'Please enter your car plate number and color.' }
};

function t(key) {
  return (translations[key] && translations[key][currentLang]) || key;
}

function toggleLang() {
  currentLang = currentLang === 'ar' ? 'en' : 'ar';
  localStorage.setItem('menuLang', currentLang);
  applyLangDirection();
  loadMenu();
}

function applyLangDirection() {
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('langToggle').textContent = currentLang === 'ar' ? 'EN' : 'عربي';
  document.getElementById('langToggle').style.display = 'block';
}

async function loadMenu() {
  const app = document.getElementById('app');
  const params = new URLSearchParams(window.location.search);
  shopId = params.get('shop');
  app.innerHTML = `<div class="state-msg">${t('loadingMenu')}</div>`;

  if (!shopId) {
    app.innerHTML = `<div class="state-msg">${t('invalidLink')}</div>`;
    return;
  }

  try {
    const shopDoc = await db.collection('shops').doc(shopId).get();

    if (!shopDoc.exists) {
      app.innerHTML = `<div class="state-msg">${t('shopNotFound')}</div>`;
      return;
    }

    const shop = shopDoc.data();
    shopInfo = shop.info || {};

    const isManuallyActive = shopInfo.subscriptionStatus === 'active';
    const pastEndDate = shopInfo.subscriptionEndDate && new Date(shopInfo.subscriptionEndDate) < new Date(new Date().toDateString());
    const isEffectivelyActive = isManuallyActive && !pastEndDate;

    if (!isEffectivelyActive) {
      app.innerHTML = `<div class="state-msg">${t('menuUnavailable')}</div>`;
      return;
    }

    if (shopInfo.primaryColor) {
      document.documentElement.style.setProperty('--accent', shopInfo.primaryColor);
    }
    const shopName = (currentLang === 'en' && shopInfo.nameEn) ? shopInfo.nameEn : (shopInfo.name || 'Menu');
    document.title = shopName;

    const menuSnap = await db.collection('shops').doc(shopId)
                              .collection('menu')
                              .orderBy('category')
                              .get();

    const categories = {};
    menuSnap.forEach(doc => {
      const item = doc.data();
      if (item.hidden === true) return; // fully hidden from customers, skip entirely
      const catAr = item.category || 'أخرى';
      const catDisplay = (currentLang === 'en' && item.categoryEn) ? item.categoryEn : catAr;
      if (!categories[catDisplay]) categories[catDisplay] = [];
      categories[catDisplay].push({ id: doc.id, ...item });
    });

    const coverStyle = shopInfo.coverImage ? `style="background-image:url('${shopInfo.coverImage}')"` : '';

    let html = `
      <div class="menu-hero" ${coverStyle}>
        ${shopInfo.logo ? `<img src="${shopInfo.logo}" class="menu-hero-logo" alt="${shopName}">` : ''}
        <div class="menu-hero-name display">${shopName}</div>
        ${shopInfo.tagline ? `<div class="menu-hero-tagline">${shopInfo.tagline}</div>` : ''}
        ${shopInfo.location ? `<div class="menu-hero-location">${shopInfo.location}</div>` : ''}
      </div>
    `;

    const categoryNames = Object.keys(categories);

    if (categoryNames.length === 0) {
      html += `<div class="state-msg">${t('noItems')}</div>`;
    } else if (categoryNames.length > 1) {
      html += '<div class="category-pills" id="categoryPills">';
      categoryNames.forEach((cat, i) => {
        html += `<button class="pill ${i === 0 ? 'active' : ''}" data-cat="cat-${i}" onclick="scrollToCategory('cat-${i}', this)">${cat}</button>`;
      });
      html += '</div>';
    }

    categoryNames.forEach((category, i) => {
      const items = categories[category];
      html += `<div class="category-title" id="cat-${i}">${category}</div>`;
      html += '<div class="menu-grid">';
      items.forEach(item => {
        const unavailable = item.available === false;
        const itemName = (currentLang === 'en' && item.nameEn) ? item.nameEn : item.name;
        itemMeta[item.id] = { name: itemName, price: item.price };
        html += `
          <div class="grid-card ${unavailable ? 'unavailable' : ''}">
            <div class="grid-card-img-wrap">
              ${item.image ? `<img src="${item.image}" class="grid-card-img" alt="">` : ''}
              ${unavailable ? `<div class="grid-unavailable-tag">${t('unavailableTag')}</div>` : `
                <div class="grid-qty-container" id="qtyctrl-${item.id}">${renderQtyControl(item.id, 0)}</div>
              `}
            </div>
            <div class="grid-card-body">
              <div class="grid-card-name">${itemName}</div>
              <div class="grid-card-price">${Number(item.price).toFixed(2)} ${t('currency')}</div>
            </div>
          </div>
        `;
      });
      html += '</div>';
    });

    app.innerHTML = html;

    // Resume tracking a previously placed order, if one is still active for this shop
    // (survives page refresh, since it's stored in the browser, not just in memory)
    const savedOrderId = localStorage.getItem(`activeOrder_${shopId}`);
    if (savedOrderId) {
      trackOrder(savedOrderId);
    }

  } catch (err) {
    console.error(err);
    app.innerHTML = `<div class="state-msg">${t('loadError')}<br><small style="color:#B3441E;">${err.code || ''} ${err.message || err}</small></div>`;
  }
}

function escapeStr(str) {
  return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function scrollToCategory(catId, pillEl) {
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  pillEl.classList.add('active');
  const target = document.getElementById(catId);
  const pillsBar = document.getElementById('categoryPills');
  const offset = pillsBar ? pillsBar.offsetHeight + 12 : 12;
  const top = target.getBoundingClientRect().top + window.pageYOffset - offset;
  window.scrollTo({ top, behavior: 'smooth' });
}

// ---- Cart logic ----
function renderQtyControl(itemId, qty) {
  if (qty <= 0) {
    return `<button class="grid-add-btn" onclick='changeQty("${itemId}", 1)'>+</button>`;
  }
  return `
    <div class="grid-qty-stepper">
      <button onclick='changeQty("${itemId}", -1)'>−</button>
      <span class="grid-qty-num">${qty}</span>
      <button onclick='changeQty("${itemId}", 1)'>+</button>
    </div>
  `;
}

function changeQty(itemId, delta) {
  const meta = itemMeta[itemId];
  if (!cart[itemId]) cart[itemId] = { name: meta.name, price: meta.price, qty: 0 };
  cart[itemId].qty += delta;
  const newQty = cart[itemId].qty > 0 ? cart[itemId].qty : 0;
  if (cart[itemId].qty <= 0) delete cart[itemId];

  const container = document.getElementById(`qtyctrl-${itemId}`);
  if (container) container.innerHTML = renderQtyControl(itemId, newQty);

  updateCartBar();
}

function updateCartBar() {
  const bar = document.getElementById('cartBar');
  const items = Object.values(cart);
  const totalQty = items.reduce((sum, i) => sum + i.qty, 0);
  const totalPrice = items.reduce((sum, i) => sum + i.qty * i.price, 0);

  if (totalQty === 0) {
    bar.style.display = 'none';
    return;
  }

  bar.style.display = 'flex';
  document.getElementById('cartCount').textContent = `${totalQty} ${t('itemsWord')}`;
  document.getElementById('cartTotal').textContent = `${totalPrice.toFixed(2)} ${t('currency')}`;
}

function openCartModal() {
  const items = Object.entries(cart);
  if (items.length === 0) return;

  selectedOrderType = 'table';
  const total = items.reduce((sum, [, i]) => sum + i.qty * i.price, 0);

  let linesHtml = '';
  items.forEach(([id, i]) => {
    linesHtml += `
      <div class="cart-line">
        <span>${i.name} × ${i.qty}</span>
        <span>${(i.qty * i.price).toFixed(2)} ${t('currency')}</span>
      </div>
    `;
  });

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'cartOverlay';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <button class="close-x" onclick="closeCartModal()">×</button>
      <h3 style="margin:8px 0 16px;">${t('reviewOrder')}</h3>
      ${linesHtml}
      <div class="cart-total-line">
        <span>${t('total')}</span>
        <span>${total.toFixed(2)} ${t('currency')}</span>
      </div>

      <div class="order-type-toggle">
        <button class="order-type-btn active" id="typeTableBtn" onclick="setOrderType('table')">
          <span class="order-type-icon">🍽️</span><span>${t('orderFromTable')}</span>
        </button>
        <button class="order-type-btn" id="typeCarBtn" onclick="setOrderType('car')">
          <span class="order-type-icon">🚗</span><span>${t('orderFromCar')}</span>
        </button>
      </div>

      <div id="tableFields">
        <div class="field">
          <label for="tableNum">${t('tableNumber')}</label>
          <input type="text" id="tableNum" placeholder="${t('tablePlaceholder')}">
        </div>
      </div>

      <div id="carFields" style="display:none;">
        <div class="field">
          <label for="carNumber">${t('carNumber')}</label>
          <input type="text" id="carNumber" placeholder="${t('carNumberPlaceholder')}">
        </div>
        <div class="field">
          <label for="carColor">${t('carColor')}</label>
          <input type="text" id="carColor" placeholder="${t('carColorPlaceholder')}">
        </div>
      </div>

      <div class="field" style="margin-top:16px;">
        <label for="custName">${t('yourName')}</label>
        <input type="text" id="custName" placeholder="${t('namePlaceholder')}" value="${localStorage.getItem('customerName') || ''}">
      </div>
      <div class="field">
        <label for="orderNotes">${t('notesLabel')}</label>
        <input type="text" id="orderNotes" placeholder="${t('notesPlaceholder')}">
      </div>

      <button class="btn" style="width:100%;" onclick="submitOrder()">${t('sendOrder')}</button>
      <div id="orderError" class="error-msg"></div>
    </div>
  `;
  document.body.appendChild(overlay);
}

let selectedOrderType = 'table';

function setOrderType(type) {
  selectedOrderType = type;
  document.getElementById('typeTableBtn').classList.toggle('active', type === 'table');
  document.getElementById('typeCarBtn').classList.toggle('active', type === 'car');
  document.getElementById('tableFields').style.display = type === 'table' ? 'block' : 'none';
  document.getElementById('carFields').style.display = type === 'car' ? 'block' : 'none';
}

function closeCartModal() {
  const overlay = document.getElementById('cartOverlay');
  if (overlay) overlay.remove();
}

async function submitOrder() {
  const errorEl = document.getElementById('orderError');
  const name = document.getElementById('custName').value.trim();
  const notes = document.getElementById('orderNotes').value.trim();

  if (!name) {
    errorEl.textContent = t('enterNameError');
    return;
  }

  let table = null, carNumber = null, carColor = null;

  if (selectedOrderType === 'car') {
    carNumber = document.getElementById('carNumber').value.trim();
    carColor = document.getElementById('carColor').value.trim();
    if (!carNumber || !carColor) {
      errorEl.textContent = t('carFieldsError');
      return;
    }
  } else {
    table = document.getElementById('tableNum').value.trim();
  }

  localStorage.setItem('customerName', name);

  const items = Object.values(cart).map(i => ({ name: i.name, price: i.price, qty: i.qty }));
  const total = items.reduce((sum, i) => sum + i.qty * i.price, 0);

  try {
    const docRef = await db.collection('shops').doc(shopId).collection('orders').add({
      customerName: name,
      orderType: selectedOrderType,
      tableNumber: table || null,
      carNumber: carNumber || null,
      carColor: carColor || null,
      notes: notes || null,
      items,
      total,
      status: 'pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    // Reset cart
    cart = {};
    updateCartBar();
    document.querySelectorAll('.grid-qty-container').forEach(el => {
      const itemId = el.id.replace('qtyctrl-', '');
      el.innerHTML = renderQtyControl(itemId, 0);
    });

    // Start live tracking of this order and show the step tracker
    trackOrder(docRef.id);

    document.querySelector('.modal-sheet').innerHTML = `
      <h3 style="margin:8px 0 20px; text-align:center;">${t('orderSent')}</h3>
      <div id="trackerContainer">${renderTracker('pending')}</div>
      <button class="btn" style="width:100%; margin-top:24px;" onclick="closeCartModal()">${t('close')}</button>
    `;
  } catch (err) {
    console.error(err);
    errorEl.textContent = t('orderSendError');
  }
}

// ---- Live order status tracking ----
const statusSteps = ['pending', 'preparing', 'ready'];

function getStatusStepLabel(status) {
  if (status === 'pending') return t('stepReceived');
  if (status === 'preparing') return t('stepPreparing');
  return t('stepReady');
}

function getStatusBarText(status) {
  if (status === 'pending') return t('barReceived');
  if (status === 'preparing') return t('barPreparing');
  return t('barReady');
}

let activeOrderId = null;
let activeOrderUnsub = null;

function trackOrder(orderId) {
  activeOrderId = orderId;
  if (activeOrderUnsub) activeOrderUnsub();

  localStorage.setItem(`activeOrder_${shopId}`, orderId);

  activeOrderUnsub = db.collection('shops').doc(shopId).collection('orders').doc(orderId)
    .onSnapshot(doc => {
      if (!doc.exists) {
        // Order was deleted — stop tracking and clean up
        clearOrderTracking();
        return;
      }
      const status = doc.data().status || 'pending';

      const bar = document.getElementById('orderStatusBar');
      bar.style.display = 'block';
      document.getElementById('statusBarText').textContent = getStatusBarText(status);
      bar.classList.toggle('status-bar-ready', status === 'ready');

      const trackerEl = document.getElementById('trackerContainer');
      if (trackerEl) trackerEl.innerHTML = renderTracker(status);
    }, err => {
      console.error('Order tracking error:', err);
    });
}

// Called when the customer confirms they've received their order,
// or when the order no longer exists in Firestore.
function clearOrderTracking() {
  if (activeOrderUnsub) activeOrderUnsub();
  activeOrderUnsub = null;
  activeOrderId = null;
  localStorage.removeItem(`activeOrder_${shopId}`);
  document.getElementById('orderStatusBar').style.display = 'none';
  closeStatusModal();
  closeCartModal();
}

function renderTracker(status) {
  const stepIndex = statusSteps.indexOf(status);

  let barHtml = '<div class="timeline-bar">';
  statusSteps.forEach((s, i) => {
    const state = i < stepIndex ? 'done' : (i === stepIndex ? 'active' : '');
    barHtml += `<div class="timeline-segment ${state}"></div>`;
  });
  barHtml += '</div>';

  let labelsHtml = '<div class="timeline-labels">';
  statusSteps.forEach((s, i) => {
    const state = i < stepIndex ? 'done' : (i === stepIndex ? 'active' : '');
    labelsHtml += `<span class="${state}">${getStatusStepLabel(s)}</span>`;
  });
  labelsHtml += '</div>';

  let etaHtml = '';
  if (status !== 'ready' && shopInfo.estimatedMinutes) {
    etaHtml = `<div style="text-align:center; color:var(--stone); font-size:0.85rem; margin-top:14px;">⏱ ${t('etaText')}: ~${shopInfo.estimatedMinutes} ${t('minuteWord')}</div>`;
  }

  let doneBtnHtml = '';
  if (status === 'ready') {
    doneBtnHtml = `<button class="btn" style="width:100%; margin-top:20px;" onclick="clearOrderTracking()">${t('orderPickedUp')}</button>`;
  }

  return `<div class="order-track">${barHtml}${labelsHtml}${etaHtml}${doneBtnHtml}</div>`;
}

function openStatusModal() {
  if (!activeOrderId) return;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'statusOverlay';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <button class="close-x" onclick="closeStatusModal()">×</button>
      <h3 style="margin:8px 0 20px; text-align:center;">${t('yourOrderStatus')}</h3>
      <div id="trackerContainer">${renderTracker(statusSteps[0])}</div>
    </div>
  `;
  document.body.appendChild(overlay);

  // Immediately refresh with the real current status
  db.collection('shops').doc(shopId).collection('orders').doc(activeOrderId).get().then(doc => {
    if (doc.exists) {
      document.getElementById('trackerContainer').innerHTML = renderTracker(doc.data().status || 'pending');
    }
  });
}

function closeStatusModal() {
  const overlay = document.getElementById('statusOverlay');
  if (overlay) overlay.remove();
}

applyLangDirection();
loadMenu();
</script>

</body>
</html>
