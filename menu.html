<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القائمة</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap" id="app">
  <div class="state-msg">جاري تحميل القائمة...</div>
</div>

<!-- Floating cart bar -->
<div class="cart-bar" id="cartBar" style="display:none;" onclick="openCartModal()">
  <span id="cartCount">0 أصناف</span>
  <span id="cartTotal">0.00 ر.ع</span>
</div>

<!-- Persistent order status bar (shown after an order is placed) -->
<div class="status-bar" id="orderStatusBar" style="display:none;" onclick="openStatusModal()">
  <span id="statusBarText"></span>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
let shopId = null;
let shopInfo = {};
let cart = {}; // { itemId: { name, price, qty } }

async function loadMenu() {
  const app = document.getElementById('app');
  const params = new URLSearchParams(window.location.search);
  shopId = params.get('shop');

  if (!shopId) {
    app.innerHTML = '<div class="state-msg">رابط غير صحيح — لا يوجد معرّف كوفي.</div>';
    return;
  }

  try {
    const shopDoc = await db.collection('shops').doc(shopId).get();

    if (!shopDoc.exists) {
      app.innerHTML = '<div class="state-msg">هذا الكوفي غير موجود.</div>';
      return;
    }

    const shop = shopDoc.data();
    shopInfo = shop.info || {};

    if (shopInfo.subscriptionStatus !== 'active') {
      app.innerHTML = '<div class="state-msg">القائمة غير متاحة حالياً.</div>';
      return;
    }

    if (shopInfo.primaryColor) {
      document.documentElement.style.setProperty('--accent', shopInfo.primaryColor);
    }
    document.title = shopInfo.name || 'القائمة';

    const menuSnap = await db.collection('shops').doc(shopId)
                              .collection('menu')
                              .orderBy('category')
                              .get();

    const categories = {};
    menuSnap.forEach(doc => {
      const item = doc.data();
      if (item.hidden === true) return; // fully hidden from customers, skip entirely
      const cat = item.category || 'أخرى';
      if (!categories[cat]) categories[cat] = [];
      categories[cat].push({ id: doc.id, ...item });
    });

    const coverStyle = shopInfo.coverImage ? `style="background-image:url('${shopInfo.coverImage}')"` : '';

    let html = `
      <div class="menu-hero" ${coverStyle}>
        ${shopInfo.logo ? `<img src="${shopInfo.logo}" class="menu-hero-logo" alt="${shopInfo.name || ''}">` : ''}
        <div class="menu-hero-name display">${shopInfo.name || 'القائمة'}</div>
        ${shopInfo.tagline ? `<div class="menu-hero-tagline">${shopInfo.tagline}</div>` : ''}
        ${shopInfo.location ? `<div class="menu-hero-location">${shopInfo.location}</div>` : ''}
      </div>
    `;

    const categoryNames = Object.keys(categories);

    if (categoryNames.length === 0) {
      html += '<div class="state-msg">لا توجد أصناف بالقائمة حالياً.</div>';
    } else if (categoryNames.length > 1) {
      html += '<div class="category-pills" id="categoryPills">';
      categoryNames.forEach((cat, i) => {
        html += `<button class="pill ${i === 0 ? 'active' : ''}" data-cat="cat-${i}" onclick="scrollToCategory('cat-${i}', this)">${cat}</button>`;
      });
      html += '</div>';
    }

    categoryNames.forEach((category, i) => {
      const items = categories[category];
      html += `<div class="category-title" id="cat-${i}">${category}</div>`;
      html += '<div class="menu-grid">';
      items.forEach(item => {
        const unavailable = item.available === false;
        html += `
          <div class="grid-card ${unavailable ? 'unavailable' : ''}">
            <div class="grid-card-img-wrap">
              ${item.image ? `<img src="${item.image}" class="grid-card-img" alt="">` : ''}
              ${unavailable ? `<div class="grid-unavailable-tag">غير متاح</div>` : `
                <span class="grid-qty-badge" id="count-${item.id}" style="display:none;">0</span>
                <button class="grid-add-btn" onclick='changeQty("${item.id}", "${escapeStr(item.name)}", ${item.price}, 1)'>+</button>
              `}
            </div>
            <div class="grid-card-body">
              <div class="grid-card-name">${item.name}</div>
              <div class="grid-card-price">${Number(item.price).toFixed(2)} ر.ع</div>
            </div>
          </div>
        `;
      });
      html += '</div>';
    });

    app.innerHTML = html;

    // Resume tracking a previously placed order, if one is still active for this shop
    // (survives page refresh, since it's stored in the browser, not just in memory)
    const savedOrderId = localStorage.getItem(`activeOrder_${shopId}`);
    if (savedOrderId) {
      trackOrder(savedOrderId);
    }

  } catch (err) {
    console.error(err);
    app.innerHTML = `<div class="state-msg">حدث خطأ أثناء تحميل القائمة.<br><small style="color:#B3441E;">${err.code || ''} ${err.message || err}</small></div>`;
  }
}

function escapeStr(str) {
  return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function scrollToCategory(catId, pillEl) {
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  pillEl.classList.add('active');
  const target = document.getElementById(catId);
  const pillsBar = document.getElementById('categoryPills');
  const offset = pillsBar ? pillsBar.offsetHeight + 12 : 12;
  const top = target.getBoundingClientRect().top + window.pageYOffset - offset;
  window.scrollTo({ top, behavior: 'smooth' });
}

// ---- Cart logic ----
function changeQty(itemId, name, price, delta) {
  if (!cart[itemId]) cart[itemId] = { name, price, qty: 0 };
  cart[itemId].qty += delta;
  if (cart[itemId].qty <= 0) delete cart[itemId];

  const countEl = document.getElementById(`count-${itemId}`);
  if (countEl) {
    const qty = cart[itemId] ? cart[itemId].qty : 0;
    countEl.textContent = qty;
    countEl.style.display = qty > 0 ? 'flex' : 'none';
  }

  updateCartBar();
}

function updateCartBar() {
  const bar = document.getElementById('cartBar');
  const items = Object.values(cart);
  const totalQty = items.reduce((sum, i) => sum + i.qty, 0);
  const totalPrice = items.reduce((sum, i) => sum + i.qty * i.price, 0);

  if (totalQty === 0) {
    bar.style.display = 'none';
    return;
  }

  bar.style.display = 'flex';
  document.getElementById('cartCount').textContent = `${totalQty} أصناف`;
  document.getElementById('cartTotal').textContent = `${totalPrice.toFixed(2)} ر.ع`;
}

function openCartModal() {
  const items = Object.entries(cart);
  if (items.length === 0) return;

  const total = items.reduce((sum, [, i]) => sum + i.qty * i.price, 0);

  let linesHtml = '';
  items.forEach(([id, i]) => {
    linesHtml += `
      <div class="cart-line">
        <span>${i.name} × ${i.qty}</span>
        <span>${(i.qty * i.price).toFixed(2)} ر.ع</span>
      </div>
    `;
  });

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'cartOverlay';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <button class="close-x" onclick="closeCartModal()">×</button>
      <h3 style="margin:8px 0 16px;">مراجعة الطلب</h3>
      ${linesHtml}
      <div class="cart-total-line">
        <span>الإجمالي</span>
        <span>${total.toFixed(2)} ر.ع</span>
      </div>

      <div class="field" style="margin-top:16px;">
        <label for="custName">اسمك</label>
        <input type="text" id="custName" placeholder="مثال: أحمد" value="${localStorage.getItem('customerName') || ''}">
      </div>
      <div class="field">
        <label for="tableNum">رقم الطاولة (اختياري)</label>
        <input type="text" id="tableNum" placeholder="مثال: 5">
      </div>
      <div class="field">
        <label for="orderNotes">ملاحظات (اختياري)</label>
        <input type="text" id="orderNotes" placeholder="مثال: بدون سكر">
      </div>

      <button class="btn" style="width:100%;" onclick="submitOrder()">إرسال الطلب</button>
      <div id="orderError" class="error-msg"></div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function closeCartModal() {
  const overlay = document.getElementById('cartOverlay');
  if (overlay) overlay.remove();
}

async function submitOrder() {
  const errorEl = document.getElementById('orderError');
  const name = document.getElementById('custName').value.trim();
  const table = document.getElementById('tableNum').value.trim();
  const notes = document.getElementById('orderNotes').value.trim();

  if (!name) {
    errorEl.textContent = 'الرجاء إدخال اسمك.';
    return;
  }

  localStorage.setItem('customerName', name);

  const items = Object.values(cart).map(i => ({ name: i.name, price: i.price, qty: i.qty }));
  const total = items.reduce((sum, i) => sum + i.qty * i.price, 0);

  try {
    const docRef = await db.collection('shops').doc(shopId).collection('orders').add({
      customerName: name,
      tableNumber: table || null,
      notes: notes || null,
      items,
      total,
      status: 'pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    // Reset cart
    cart = {};
    updateCartBar();
    document.querySelectorAll('.grid-qty-badge').forEach(el => { el.textContent = '0'; el.style.display = 'none'; });

    // Start live tracking of this order and show the step tracker
    trackOrder(docRef.id);

    document.querySelector('.modal-sheet').innerHTML = `
      <h3 style="margin:8px 0 20px; text-align:center;">تم إرسال طلبك!</h3>
      <div id="trackerContainer">${renderTracker('pending')}</div>
      <button class="btn" style="width:100%; margin-top:24px;" onclick="closeCartModal()">إغلاق</button>
    `;
  } catch (err) {
    console.error(err);
    errorEl.textContent = 'حدث خطأ أثناء إرسال الطلب. حاول مرة أخرى.';
  }
}

// ---- Live order status tracking ----
const statusSteps = ['pending', 'preparing', 'ready'];
const statusStepLabels = { pending: 'استلم طلبك', preparing: 'جاري التحضير', ready: 'الطلب جاهز' };
const statusBarTextMap = {
  pending: '✅ تم استلام طلبك',
  preparing: '🔥 جاري تحضير طلبك',
  ready: '🎉 طلبك جاهز — تفضل استلمه'
};

let activeOrderId = null;
let activeOrderUnsub = null;

function trackOrder(orderId) {
  activeOrderId = orderId;
  if (activeOrderUnsub) activeOrderUnsub();

  localStorage.setItem(`activeOrder_${shopId}`, orderId);

  activeOrderUnsub = db.collection('shops').doc(shopId).collection('orders').doc(orderId)
    .onSnapshot(doc => {
      if (!doc.exists) {
        // Order was deleted — stop tracking and clean up
        clearOrderTracking();
        return;
      }
      const status = doc.data().status || 'pending';

      const bar = document.getElementById('orderStatusBar');
      bar.style.display = 'block';
      document.getElementById('statusBarText').textContent = statusBarTextMap[status] || '';
      bar.classList.toggle('status-bar-ready', status === 'ready');

      const trackerEl = document.getElementById('trackerContainer');
      if (trackerEl) trackerEl.innerHTML = renderTracker(status);
    }, err => {
      console.error('Order tracking error:', err);
    });
}

// Called when the customer confirms they've received their order,
// or when the order no longer exists in Firestore.
function clearOrderTracking() {
  if (activeOrderUnsub) activeOrderUnsub();
  activeOrderUnsub = null;
  activeOrderId = null;
  localStorage.removeItem(`activeOrder_${shopId}`);
  document.getElementById('orderStatusBar').style.display = 'none';
  closeStatusModal();
  closeCartModal();
}

function renderTracker(status) {
  const stepIndex = statusSteps.indexOf(status);

  let barHtml = '<div class="timeline-bar">';
  statusSteps.forEach((s, i) => {
    const state = i < stepIndex ? 'done' : (i === stepIndex ? 'active' : '');
    barHtml += `<div class="timeline-segment ${state}"></div>`;
  });
  barHtml += '</div>';

  let labelsHtml = '<div class="timeline-labels">';
  statusSteps.forEach((s, i) => {
    const state = i < stepIndex ? 'done' : (i === stepIndex ? 'active' : '');
    labelsHtml += `<span class="${state}">${statusStepLabels[s]}</span>`;
  });
  labelsHtml += '</div>';

  let etaHtml = '';
  if (status !== 'ready' && shopInfo.estimatedMinutes) {
    etaHtml = `<div style="text-align:center; color:var(--stone); font-size:0.85rem; margin-top:14px;">⏱ الوقت المتوقع: ~${shopInfo.estimatedMinutes} دقيقة</div>`;
  }

  let doneBtnHtml = '';
  if (status === 'ready') {
    doneBtnHtml = `<button class="btn" style="width:100%; margin-top:20px;" onclick="clearOrderTracking()">طلب جاهز</button>`;
  }

  return `<div class="order-track">${barHtml}${labelsHtml}${etaHtml}${doneBtnHtml}</div>`;
}

function openStatusModal() {
  if (!activeOrderId) return;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'statusOverlay';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <button class="close-x" onclick="closeStatusModal()">×</button>
      <h3 style="margin:8px 0 20px; text-align:center;">حالة طلبك</h3>
      <div id="trackerContainer">${renderTracker(statusSteps[0])}</div>
    </div>
  `;
  document.body.appendChild(overlay);

  // Immediately refresh with the real current status
  db.collection('shops').doc(shopId).collection('orders').doc(activeOrderId).get().then(doc => {
    if (doc.exists) {
      document.getElementById('trackerContainer').innerHTML = renderTracker(doc.data().status || 'pending');
    }
  });
}

function closeStatusModal() {
  const overlay = document.getElementById('statusOverlay');
  if (overlay) overlay.remove();
}

loadMenu();
</script>

</body>
</html>
